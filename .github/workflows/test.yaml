name: Test
on: [push, pull_request]
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload automated test failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reader-test-results
          path: test-results/
          retention-days: 7
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.test.yaml --profile test config --quiet
      - run: docker compose -f compose.yaml -f compose.test.yaml --profile test run --build --rm integration
      - name: Verify distribution notices
        run: |
          docker build -t reader-license-app -f Dockerfile.reader .
          docker build -t reader-license-web .
          python scripts/check_packaged_notices.py --app-image reader-license-app --web-image reader-license-web
      - if: failure()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test logs
      - if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test down
