name: Test
on: [push, pull_request]
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check third-party notices
        run: |
          go mod download all
          python scripts/update_notices.py --check
      - run: python -B -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.test.yaml --profile test config --quiet
      - run: docker compose -f compose.yaml -f compose.test.yaml --profile test run --build --rm integration
      - if: failure()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test logs
      - if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test down
