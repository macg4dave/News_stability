services:
  app:
    environment:
      PUBLIC_ORIGIN: http://localhost
      # Integration must never use the LAN server. Authenticated checks belong
      # in TLS httptest fixtures; this stack covers browser/proxy boundaries.
      NEWSBLUR_ORIGIN: https://unreachable.invalid

  web-test:
    build: .
    profiles: [test]
    networks:
      default:
        aliases: [reader.test]
    depends_on:
      app:
        condition: service_healthy

  integration:
    image: python:3.13-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./tests:/workspace:ro
    environment:
      TEST_BASE_URL: http://reader.test
    command: python -B -m unittest -v integration
    depends_on:
      web-test:
        condition: service_healthy
