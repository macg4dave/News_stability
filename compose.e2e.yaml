# Standalone test stack: no LAN upstream, user overrides, or source bind mounts.
services:
  newsblur-fixture:
    build:
      context: .
      dockerfile: tests/e2e/upstream/Dockerfile
    volumes:
      - fixture-ca:/fixture-ca
    ports:
      - "127.0.0.1:${E2E_CONTROL_PORT:?}:8081"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8081/]
      interval: 1s
      timeout: 2s
      retries: 30
  app:
    build:
      context: .
      dockerfile: Dockerfile.reader
    environment:
      HTTP_ADDR: :8090
      PUBLIC_ORIGIN: http://127.0.0.1:${E2E_PORT:?}
      NEWSBLUR_ORIGIN: https://newsblur-fixture:8443
      NEWSBLUR_CA_FILE: /fixture-ca/ca.pem
    volumes:
      - fixture-ca:/fixture-ca:ro
    depends_on:
      newsblur-fixture:
        condition: service_healthy
  web:
    build: .
    ports:
      - "127.0.0.1:${E2E_PORT:?}:80"
    depends_on:
      app:
        condition: service_healthy
volumes:
  fixture-ca:
