services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.reader
    environment:
      HTTP_ADDR: :8090
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    environment:
      NEWSBLUR_ORIGIN: ${NEWSBLUR_ORIGIN:-http://news101.lan}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  test:
    image: python:3.13-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: python -B -m unittest discover -s tests -v
